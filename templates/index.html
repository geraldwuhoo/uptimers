<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uptime.rs</title>
    <base target="_blank">
    <style>
        body {
            max-width: 40em;
            margin: 40px auto;
            padding: 0 2em;
            font: 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            overflow-x: hidden;
        }

        a {
            color: #000;
            text-decoration: none;
            transition: 0.25s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        .button {
            border-radius: 0.5em;
            color: white;
            display: inline-block;
            flex-shrink: 0;
            min-width: 5em;
            padding: .35em .65em;
            text-align: center;
            vertical-align: baseline;
        }

        .green {
            background-color: #5cdd8b;
        }

        .red {
            background-color: #dc3545;
        }

        .grey {
            background-color: #ccc;
        }

        p {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .6em;
        }

        .beats {
            display: flex;
            flex-shrink: 0;
            gap: 3px;
            margin-left: auto;
        }

        .beats span {
            width: 7px;
            height: 30px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Services</h1>
    </header>
    <main>
        {% for site in sites -%}
        <a href="{{ site.site }}">
            <p>
                {% let percent = "{:.2}%"|format(100.0 * site.avg.unwrap_or_default()) -%}
                <span class="button {% if site.success %}green{% else %}red{% endif %}">{{ percent }}</span>
                {{ site.name }}
                <span class="beats">{% for beat in site.beats -%}
                <span class="{% if *beat == 1 %}green{% else if *beat == 2 %}red{% else %}grey{% endif %}"></span>
                {%- endfor %}</span>
            </p>
        </a>
        {% endfor -%}
    </main>
</body>

</html>
