[package]
name = "uptimers"
version = "0.3.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.14.0"
askama = "0.16.0"
clap = { version = "4.6.4", features = ["env", "derive"] }
env_logger = "0.11.11"
futures = "0.3.33"
log = "0.4.33"
reqwest = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-native-tls"] }
thiserror = "2.0.0"
time = { version = "0.3.54", features = ["parsing"] }
openssl = { version = "0.10.81", features = ["vendored"] }

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
